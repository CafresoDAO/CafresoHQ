# ── CafresoHQ — local Mac container (Docker Desktop) ────────────────────────
# Replaces the hand-made `cafresohq` container with a declarative setup:
#
#   docker compose -f docker-compose.local.yml up -d      # start (or apply changes)
#   docker compose -f docker-compose.local.yml logs -f    # watch logs
#   docker compose -f docker-compose.local.yml down       # stop
#
# ⚠ SEARCH WORKER MOVED (2026-08): serve.py no longer contains the search-
# network worker or the gap/news/topics crons. The SEARCH_WORKER / WORKER_* /
# GAP_CRON / NEWS_CRON / TOPICS_CRON entries in `worker.env` are now ignored
# by this container. Run the worker as its own service instead:
#
#   docker compose -f docker-compose.worker.yml up -d --build
#
# cafreso.com shows "network asleep" whenever no worker has heartbeated for
# 10 minutes — so keep the worker compose running, not just this one.
# serve.py proxies /gap/status and /news/status to it (WORKER_STATUS_URL,
# default http://127.0.0.1:8788).
#
# `restart: unless-stopped` = auto-restart after crashes and Mac reboots
# (as long as Docker Desktop launches at login).

services:
  cafresohq:
    # Built locally from this repo — the Docker Hub image (anthonycf1/
    # cafresoai-serve:latest) predates the search-network worker code.
    # After a `git pull`: docker compose -f docker-compose.local.yml up -d --build
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cafresoai-serve:local
    container_name: cafresohq
    ports:
      - "8787:8787"
    env_file:
      - worker.env
    environment:
      # Line-buffered stdout so logs show up in `docker logs` immediately
      # instead of sitting in Python's block buffer.
      PYTHONUNBUFFERED: "1"
      # /gap/status and /news/status proxy the standalone worker container.
      # host.docker.internal because the worker publishes 8788 on the Mac,
      # not inside this container's netns.
      WORKER_STATUS_URL: "http://host.docker.internal:8788"
      # Gap cron now runs hourly (was once/day @10am ET) — GAP_PER_RUN_MAX is
      # a per-run cap, not a daily one; defaults (2/run, 60min) apply if unset.
      # News + weather are new crons, opt-in via *_CRON=1 in serve.py — turned
      # on here per-container rather than by default in code, so a stale image
      # pulled elsewhere doesn't silently start hitting Brave/NWS unasked.
      # ALL auto-content crons off 2026-08 — search/library/news pulled from
      # the public site while the DAO runs lean; every cron write costs ydacz
      # cycles. Re-enable deliberately when revenue covers the burn.
      NEWS_CRON: "0"
      WEATHER_CRON: "0"
      GAP_CRON: "0"
      TOPICS_CRON: "0"
      # Overrides worker.env's SEARCH_WORKER=1 — stop polling the ydacz job
      # queue entirely (each poll is a paid update call; no public jobs exist
      # while search is hidden).
      SEARCH_WORKER: "0"
    volumes:
      - cafresohq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  cafresohq-data:
    external: true   # reuse the existing volume — all your HQ state is in it
