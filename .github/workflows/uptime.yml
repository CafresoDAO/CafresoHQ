name: uptime
# Scheduled production watchdog. Checks, every 30 minutes:
#   1. both frontend domains are up AND serve identical entry bundles
#      (drift between cafreso.com / ai.cafreso.com once shipped a missing
#      feature — this catches it within half an hour)
#   2. the fleet API on the OCI gateway is alive (/fleet/health)
# A failing run triggers GitHub's default workflow-failure email to the repo
# owner. No secrets required. Manual runs via workflow_dispatch.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: both sites are up
        run: |
          set -euo pipefail
          # cafreso.com and CafresoHQ are separate builds now, so each only has to serve one.
          entries() { grep -oE '_app/immutable/entry/[a-zA-Z0-9._-]+\.js' | sort -u; }
          for d in https://cafreso.com https://ai.cafreso.com; do
            E="$(curl -fsS --max-time 20 "$d/index.html?cb=$(date +%s)" | entries)"
            echo "$d:"; echo "$E"
            [ -n "$E" ] || { echo "::error::$d served no entry bundles"; exit 1; }
          done

      - name: fleet gateway alive
        run: |
          set -euo pipefail
          # api.cafreso.com is the gateway; hq.cafreso.com was its name until the app took it.
          J="$(curl -fsS --max-time 20 https://api.cafreso.com/fleet/health || curl -fsS --max-time 20 https://hq.cafreso.com/fleet/health)"
          echo "$J"
          echo "$J" | grep -q '"status": *"ok"' || { echo "::error::fleet API unhealthy"; exit 1; }
