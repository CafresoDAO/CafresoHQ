name: tests

# Two guards run on every PR:
#
#  1. build — the UI is ~30k lines of hand-written JSX with no types and no
#     linting, bundled by esbuild. A syntax error in a 300 KB file is otherwise
#     only discovered when a browser fails to boot, so the bundle and the Python
#     entrypoints are compiled here first.
#
#  2. tests — every Python suite, via scripts/run_tests.py. That runner exists
#     because the suites are hand-rolled and several print "N FAILED" while
#     still exiting 0; it treats a printed failure summary as a failure and
#     aggregates the exit codes. Previously only test_night_grammar.py ran, so
#     six working suites were green-by-absence.
#
# The night-grammar suite specifically guards day/night parity: night_runner.py
# re-implements the bracket-marker grammar from hq-runtime.jsx TOOL_REGISTRY in
# Python and the two MUST stay byte-identical, or day and night agents silently
# diverge.

on:
  pull_request: {}
  push:
    branches:
      - merge/pages-cafresoai
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint (no-undef tripwire for the ES-module conversion)
        run: npm run lint

      - name: Build UI bundle
        run: npm run build

      - name: Verify the manifest lists every expected chunk
        run: python3 scripts/check_bundle.py

      - name: Byte-compile the Python entrypoints
        run: python3 -m compileall -q serve.py night_runner.py claude_approval_hook.py

  tests:
    runs-on: ubuntu-latest
    # The deadline-salvage suites deliberately simulate 75s-blocking gateways
    # and 90s stalls, so this job is minutes, not seconds, by design.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suites lift real .jsx into Node and bundle it with esbuild, and a
      # handful measure the built app in a headless Chrome. Without these two
      # steps nineteen of them fail on `npx esbuild` / a missing dist-ui/ and
      # the run reads as a red branch (measured 2026-09-06: 568/595 here
      # against 587/595 on a machine with node_modules).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps + build the UI bundle the suites measure
        run: npm ci && npm run build

      # test_worker_payout_sweep_does_not_wipe_mid_sweep_accrual.py skips its
      # moc compile check (soft-FAILs the whole suite) without dfx on PATH.
      # dfxvm lazily fetches the pinned version (.dfx-version, 0.24.3) on
      # first `dfx build --check` — a local compile, no replica/network touch.
      - name: Install dfx (for the genuine main.mo compile check)
        env:
          DFXVM_INIT_YES: "true"
        run: |
          sh -ci "$(curl -fsSL https://internetcomputer.org/install.sh)"
          echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Python suites
        run: python3 scripts/run_tests.py
